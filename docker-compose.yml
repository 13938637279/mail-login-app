services:
  app:
    build: .
    container_name: mail-login-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CRON_TOKEN=${CRON_TOKEN}
      - MAX_MONITORS=${MAX_MONITORS:-50}
      - REFRESH_MAX_LOAD=${REFRESH_MAX_LOAD:-2.0}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - PDD_CLIENT_ID=${PDD_CLIENT_ID}
      - PDD_CLIENT_SECRET=${PDD_CLIENT_SECRET}
      - PDD_PID=${PDD_PID}
    volumes:
      - ./data:/app/data
